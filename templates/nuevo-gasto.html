<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="../static/css/styles.css">
    <script src="../static/js/validarCamposGasto.js"></script>
</head>
<body>
    <nav class="nav-container">
        <ul>
          <li class="push"><a href="login.html">Iniciar sesión</a></li>
        </ul>
    </nav>

    <main>
        <div class="contenido">
            <h1>Trackeo de gastos</h1>

            <form action="/gasto" method="POST">
                <div class="form-group fecha">
                    <label for="fecha">Fecha:</label>
                    <input type="date" id="fecha" name="fecha">
                </div>
                
                <div class="form-group categoria">
                    <label for="categoria">Categoria:</label>
                    <input type="text" id="categoria" name="categoria">
                </div>
                
                <div class="form-group monto">
                    <label for="Monto">Monto:</label>
                    <input type="number" step="0.01" id="monto" name="Monto">
                </div>
                
                <div class="form-group concepto">
                    <label for="concepto">Concepto:</label>
                    <input type="text" id="concepto" name="concepto">
                </div>

                <button type="submit">Añadir gasto</button>
            </form>

            <a href="../index.html">
                <button>Guardar presupuesto</button>
            </a>
            
            <a href="../index.html">
                <button>Volver al inicio</button>
            </a>
        </div>
    </main>
</body>
</html>
