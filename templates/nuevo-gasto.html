<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="../static/css/styles.css">
    <script src="../static/js/validarCamposGasto.js"></script>
</head>
<body>
    <nav class="nav-container">
        <ul>
          <li class="push"><a href="">Iniciar sesión</a></li>
        </ul>
    </nav>

    <main>
        <h1>Trackeo de gastos</h1>

        <form action="/gasto" method="POST">
            <label for="fecha">Fecha:</label>
            <input type="date" id="fecha" name="fecha">
            <span class="error-fecha"></span>
            
            <label for="categoria">Categoria:</label>
            <input type="text" id="categoria" name="categoria">
            <span class="error-categoria"></span>
            
            <label for="Monto">Monto:</label>
            <input type="number" step="0.01" id="monto" name="Monto">
            <span class="error-monto"></span>
            
            <label for="concepto">Concepto:</label>
            <input type="text" id="concepto" name="concepto">
            <span class="error-concepto"></span>

            <button type="submit">Añadir gasto</button>
        </form>
        
        <a href="../index.html">
            <button>Volver al inicio</button>
        </a>
    </main>
</body>
</html>
