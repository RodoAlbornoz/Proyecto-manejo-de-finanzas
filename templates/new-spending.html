<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trackeo de gastos</title>
    <link rel="stylesheet" href="../static/css/styles.css">
    <link href='https://fonts.googleapis.com/css?family=Inter' rel='stylesheet'>
    <script src="../static/js/validarCamposGasto.js"></script>
</head>
<body>
    <nav class="nav-container">
        <ul>
          <li class="push"><a href="login.html">Iniciar sesión</a></li>
        </ul>
    </nav>

    <main>
        <div class="content">
            <h1>Trackeo de gastos</h1>

            <form action="/spending" method="POST">
                <div class="date form">
                    <label for="date">Fecha:</label>
                    <input type="date" id="date" name="date">
                </div>
                
                <div class="form category">
                    <label for="category">Categoria:</label>
                    <input type="text" id="category" name="category">
                </div>
                
                <div class="form amount">
                    <label for="amount">Monto:</label>
                    <input type="number" id="amount" name="amount">
                </div>
                
                <div class="form concept">
                    <label for="concept">Concepto:</label>
                    <input type="text" id="concept" name="concept">
                </div>

                <button type="submit">Añadir gasto</button>
            </form>

            <a href="../index.html">
                <button>Guardar presupuesto</button>
            </a>
            
            <a href="../index.html">
                <button>Volver al inicio</button>
            </a>
        </div>
    </main>
</body>
</html>
